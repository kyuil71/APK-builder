plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def runNo = System.getenv('GITHUB_RUN_NUMBER') ?: '0'

android {
    namespace 'com.kyuil71.roadguardian'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kyuil71.roadguardian'
        minSdk 26
        targetSdk 34
        versionCode runNo.toInteger() < 1 ? 1 : runNo.toInteger()
        versionName "0.1." + runNo
        // 폴드8 울트라 = 64비트 ARM. 다른 구조를 빼서 APK 크기를 줄임
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        // 이 앱 전용 서명 키 (공용 디버그 키 대신). 매번 같은 키라 덮어 설치(업데이트)가 됩니다.
        // 비밀번호는 GitHub Secrets(RG_KEY_PASS)가 있으면 그것을, 없으면 아래 값을 씁니다.
        release {
            storeFile file('../signing/roadguardian.jks')
            storePassword System.getenv('RG_KEY_PASS') ?: 'rg-9Xk8QFx2ilN5'
            keyAlias 'roadguardian'
            keyPassword System.getenv('RG_KEY_PASS') ?: 'rg-9Xk8QFx2ilN5'
        }
    }
    buildTypes {
        // 정식(릴리스) 빌드: 디버그 기능 꺼짐 → 보안 검사에서 '개발용 앱'으로 의심받지 않게
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
        }
        debug { signingConfig signingConfigs.release }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    androidResources { noCompress 'onnx' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    def camerax = '1.3.4'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'
}
