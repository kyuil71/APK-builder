plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def runNo = System.getenv('GITHUB_RUN_NUMBER') ?: '0'

android {
    namespace 'com.kyuil71.roadguardian'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kyuil71.roadguardian'
        minSdk 26
        targetSdk 34
        versionCode runNo.toInteger() < 1 ? 1 : runNo.toInteger()
        versionName "0.1." + runNo
        // 폴드8 울트라 = 64비트 ARM. 다른 구조를 빼서 APK 크기를 줄임
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        // APK-builder 저장소의 고정 키 — 매번 같은 서명이라 덮어 설치(업데이트)가 됩니다
        fixed {
            storeFile file('../../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }
    androidResources { noCompress 'onnx' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    def camerax = '1.3.4'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'
}
