plugins {
    id 'com.android.application'
}

// 앱 하나 = flavor 하나. 새 HTML 앱을 추가하려면 아래 productFlavors에 한 블록 추가하고
// app/src/<이름>/assets/index.html 을 넣으면 됩니다.
def runNo = System.getenv('GITHUB_RUN_NUMBER') ?: '0'

android {
    namespace 'com.kyuil71.htmlapp'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode runNo.toInteger() < 1 ? 1 : runNo.toInteger()
        versionName "1.0." + runNo
    }

    flavorDimensions 'app'
    productFlavors {
        softsmile {
            dimension 'app'
            applicationId 'com.kyuil71.softsmile'
            resValue 'string', 'app_name', '말랑한 미소'
            resValue 'color', 'app_bg', '#F8F2EA'
            resValue 'color', 'icon_bg', '#F3E2D6'
            resValue 'bool', 'light_bars', 'true'
        }
        cmfcube {
            dimension 'app'
            applicationId 'com.kyuil71.cmfcube'
            resValue 'string', 'app_name', '도약 CMF 큐브'
            resValue 'color', 'app_bg', '#000000'
            resValue 'color', 'icon_bg', '#0B0C10'
            resValue 'bool', 'light_bars', 'false'
        }
    }

    signingConfigs {
        // 저장소에 고정된 키 — 매번 같은 서명이라 업데이트 설치가 됩니다
        fixed {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    // 3D 텍스처·JS를 압축하지 않아 로딩이 빠르도록
    androidResources {
        noCompress 'js', 'html'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
