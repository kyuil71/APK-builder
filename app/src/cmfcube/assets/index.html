<link href="./vendor/fonts/ibm-plex-sans-kr.css" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#1c1d20; --sub:#5d6066; --line:rgba(0,0,0,.12);
  --panel:rgba(236,236,233,.86); --chip:rgba(255,255,255,.6); --chipOn:#1c1d20; --chipOnInk:#f1f1ee;
  --cold:#3e5a8a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e4e3df; --sub:#9a9ca1; --line:rgba(255,255,255,.12);
    --panel:rgba(22,23,26,.82); --chip:rgba(255,255,255,.05); --chipOn:#e6eeff; --chipOnInk:#15161a;
    --cold:#bcd0f5;
  }
}
:root[data-theme="dark"]{
  --ink:#e4e3df; --sub:#9a9ca1; --line:rgba(255,255,255,.12);
  --panel:rgba(22,23,26,.82); --chip:rgba(255,255,255,.05); --chipOn:#e6eeff; --chipOnInk:#15161a;
  --cold:#bcd0f5;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cold);outline-offset:2px}

.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3}
.title{pointer-events:auto;min-width:0;flex:1;margin-right:12px;color:#e4e3df;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.title b{display:block;font-weight:600;font-size:18px;letter-spacing:-.01em}
.title span{font-size:16px;color:#a8aab0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{pointer-events:auto;flex:none;display:flex;background:rgba(20,21,24,.7);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.seg button{white-space:nowrap;border:0;background:none;color:#cfd0d3;padding:6px 14px;border-radius:999px;font-size:16px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:#e6eeff;color:#15161a}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;pointer-events:none}
.sheet{pointer-events:auto;width:100%;max-width:430px;background:var(--panel);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:12px 0 calc(env(safe-area-inset-bottom,0px) + 12px);max-height:62vh;display:flex;flex-direction:column}
@media (min-width:900px){.dock{justify-content:flex-end;bottom:16px;right:16px;left:auto}.sheet{border-radius:20px;border:1px solid var(--line);width:400px;max-height:calc(100vh - 120px)}}
.sheet{transition:padding .25s}
.handle{display:flex;align-items:center;gap:6px;padding:0 10px 10px;touch-action:none;user-select:none}
.grip{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;padding:2px 0;min-height:44px;justify-content:center}
.grip::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--sub);opacity:.6}
.grip span{font-size:16px;line-height:1.2}
.grip small{font-size:14px;color:var(--sub)}
.nav{border:1px solid var(--line);background:var(--chip);border-radius:12px;width:44px;height:44px;font-size:18px;cursor:pointer;flex:none}
.sheet .body{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sheet.collapsed .body{display:none}
.sheet.collapsed{padding-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:8px 12px 8px 8px;cursor:pointer;text-align:left;min-height:52px}
.chip i{width:32px;height:32px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.chip span{display:block;font-size:16px;white-space:nowrap;line-height:1.25}
.chip small{display:block;font-size:13px;color:var(--sub);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnInk);border-color:transparent}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}

.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 10px;font-size:16px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.pane{overflow-y:auto;padding:12px 16px 4px;-webkit-overflow-scrolling:touch}
.pane[hidden]{display:none}

.spec h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.spec .en{color:var(--sub);font-size:16px;margin:0 0 8px}
.spec .mat{font-size:16px;margin:0 0 12px}
.spec dl{margin:0;display:grid;grid-template-columns:72px 1fr;gap:6px 12px;font-size:16px}
.spec dt{color:var(--sub)}
.spec dd{margin:0}
.spec .note{margin:12px 0 4px;font-size:16px;color:var(--sub);border-left:2px solid var(--cold);padding-left:10px}

.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pill{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 14px;font-size:16px;cursor:pointer;min-height:38px}
.pill[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnInk);border-color:transparent}
.grp{font-size:14px;color:var(--sub);margin:4px 0 6px}
.sl{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;margin:6px 0}
.sl label{font-size:16px}
.sl output{font-size:14px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--cold);height:28px}

#load{position:fixed;inset:0;display:grid;place-items:center;color:#9a9ca1;font-size:16px;z-index:9;background:#000;transition:opacity .6s}
#load.done{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){#load{transition:none}}
</style>

(function(){

  addEventListener('error',function(e){var t=e.target;if(t&&t!==window&&(t.src||t.href))show('파일을 불러오지 못함 '+(t.src||t.href));else if(e.message)show(e.message);},true);
  addEventListener('unhandledrejection',function(e){show(String(e.reason&&e.reason.message||e.reason));});
  setTimeout(function(){if(L&&!L.classList.contains('done')&&L.textContent.indexOf('/8')<0){
    var gl=document.createElement('canvas').getContext('webgl2');show(gl?'3D 엔진이 시작되지 않았습니다. 앱을 다시 실행해 주세요.':'이 기기에서 WebGL2를 사용할 수 없습니다.');}},20000);
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ───────── 렌더러 / 씬 ───────── */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; // AgX는 하이라이트 채도를 크게 깎아 색이 탁해짐 → ACES
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
RectAreaLightUniformsLib.init();
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32,1,.05,100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping=true; controls.dampingFactor=.08; controls.minDistance=.8; controls.maxDistance=14;
controls.maxPolarAngle=Math.PI*.495;controls.enablePan=false;controls.minDistance=1; controls.autoRotateSpeed=.7;
const pmrem = new THREE.PMREMGenerator(renderer);
/* 후처리: MSAA 렌더 → 네온 블룸 → 톤매핑/sRGB → 채도·블랙 포인트 */
const rt = new THREE.WebGLRenderTarget(1,1,{type:THREE.HalfFloatType,samples:4});
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256,256), 1.0, .42, .95);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms:{tDiffuse:{value:null},sat:{value:1.35},blk:{value:.025}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D tDiffuse;uniform float sat,blk;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);float l=dot(c.rgb,vec3(.2126,.7152,.0722));c.rgb=max(mix(vec3(l),c.rgb,sat),0.);c.rgb=max(c.rgb-blk,0.)/(1.-blk);gl_FragColor=c;}'
});
composer.addPass(grade);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

/* ───────── 맵 생성 유틸 (한 면 = 60 mm 레이아웃) ───────── */
const S = 768;
let seed = 11;
const rnd=()=>(seed=(seed*16807)%2147483647,(seed-1)/2147483646);
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const hx=h=>{const n=parseInt(h.slice(1),16);return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];};
const lerp3=(a,b,t,o)=>{o[0]=a[0]+(b[0]-a[0])*t;o[1]=a[1]+(b[1]-a[1])*t;o[2]=a[2]+(b[2]-a[2])*t;return o;};
const g=(o,v)=>{o[0]=o[1]=o[2]=v;};
const neon=(v,c,b=0)=>{const d=Math.abs(v-c);return Math.min(1,ss(.0045,.0012,d)+ss(.04,0,d)*.22)*(1-b);};
const Z=(u,v)=>{const r=Math.hypot(u-.5,v-.5)*2, e=Math.min(u,1-u,v,1-v);return {r,e,b:ss(.07,.035,e)};};
const white=()=>{const h=new Float32Array(S*S);for(let i=0;i<h.length;i++)h[i]=rnd();return h;};
function blur(h,r){
  const t=new Float32Array(S*S),o=new Float32Array(S*S),w=2*r+1;
  for(let y=0;y<S;y++){let s=0;for(let k=-r;k<=r;k++)s+=h[y*S+((k+S)%S)];
    for(let x=0;x<S;x++){t[y*S+x]=s/w;s+=h[y*S+((x+r+1)%S)]-h[y*S+((x-r+S)%S)];}}
  for(let x=0;x<S;x++){let s=0;for(let k=-r;k<=r;k++)s+=t[((k+S)%S)*S+x];
    for(let y=0;y<S;y++){o[y*S+x]=s/w;s+=t[((y+r+1)%S)*S+x]-t[((y-r+S)%S)*S+x];}}
  return o;
}
function vnoise(cx,cy){
  const gr=new Float32Array(cx*cy);for(let i=0;i<gr.length;i++)gr[i]=rnd();
  const h=new Float32Array(S*S);
  for(let y=0;y<S;y++){const fy=y/S*cy,iy=Math.floor(fy);let ty=fy-iy;ty=ty*ty*(3-2*ty);
    for(let x=0;x<S;x++){const fx=x/S*cx,ix=Math.floor(fx);let tx=fx-ix;tx=tx*tx*(3-2*tx);
      const y0=(iy%cy)*cx,y1=((iy+1)%cy)*cx,x0=ix%cx,x1=(ix+1)%cx;
      const a=gr[y0+x0],b=gr[y0+x1],c=gr[y1+x0],d=gr[y1+x1];
      h[y*S+x]=a+(b-a)*tx+(c-a)*ty+(a-b-c+d)*tx*ty;}}
  return h;
}
const mix=(...p)=>{const h=new Float32Array(S*S);for(const [a,w] of p)for(let i=0;i<h.length;i++)h[i]+=a[i]*w;return h;};
function eachPx(fn){for(let y=0;y<S;y++){const v=(y+.5)/S;for(let x=0;x<S;x++)fn((x+.5)/S,v,y*S+x,x,y);}}
function cnv(fn){const c=document.createElement('canvas');c.width=c.height=S;const ctx=c.getContext('2d');const im=ctx.createImageData(S,S);fn(im.data);ctx.putImageData(im,0,0);return c;}
function pix(fn){const o=[0,0,0];return cnv(d=>eachPx((u,v,i,x,y)=>{fn(u,v,o,i,x,y);const k=i*4;d[k]=o[0]*255;d[k+1]=o[1]*255;d[k+2]=o[2]*255;d[k+3]=255;}));}
function normalMap(h,str){
  return cnv(d=>{for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const l=h[y*S+Math.max(0,x-1)],r=h[y*S+Math.min(S-1,x+1)],u=h[Math.max(0,y-1)*S+x],b=h[Math.min(S-1,y+1)*S+x];
    const nx=(l-r)*str,ny=(b-u)*str,il=1/Math.hypot(nx,ny,1),k=(y*S+x)*4;
    d[k]=(nx*il*.5+.5)*255;d[k+1]=(ny*il*.5+.5)*255;d[k+2]=(il*.5+.5)*255;d[k+3]=255;}});
}
function T(c,srgb){const t=new THREE.CanvasTexture(c);t.anisotropy=maxAniso;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t;}
/* 맵 묶음 → MeshPhysicalMaterial */
function phys(p,m={}){
  const q={...p}; ['sheenColor','attenuationColor','emissive'].forEach(k=>{if(q[k])q[k]=new THREE.Color(q[k]);});
  const mat=new THREE.MeshPhysicalMaterial(q);
  if(m.map)mat.map=T(m.map,true);
  if(m.rough)mat.roughnessMap=T(m.rough);
  if(m.metal)mat.metalnessMap=T(m.metal);
  if(m.normal)mat.normalMap=T(m.normal);
  if(m.ccMap)mat.clearcoatMap=T(m.ccMap);
  if(m.ccRough)mat.clearcoatRoughnessMap=T(m.ccRough);
  if(m.ccNormal)mat.clearcoatNormalMap=T(m.ccNormal);
  if(m.sheenMap)mat.sheenColorMap=T(m.sheenMap,true);
  if(m.emissive)mat.emissiveMap=T(m.emissive,true);
  mat.userData.baseRough=q.roughness??1; mat.userData.glow=q.emissiveIntensity??0; mat.userData.envBoost=m.envBoost||1;
  return mat;
}
/* 하프톤 망점: 피치 p(px) 안에서 커버리지 cov(0–1)를 원형 도트로 */
function dot(x,y,p,cov){const cx=(Math.floor(x/p)+.5)*p,cy=(Math.floor(y/p)+.5)*p;const R=Math.sqrt(Math.max(0,cov))*p*.62;return Math.min(1,Math.max(0,R-Math.hypot(x+.5-cx,y+.5-cy)+.5));}

/* ───────── 소재 8종 ───────── */
const DEFS = [
{kr:'도약선 아노다이즈',en:'Leapline Anodized Aluminum',type:'단일 소재',mat:'Aluminum 6061',

    H[i]=prof*.45+fib[i]*.08+D[i]*.8;});
  const wh=hx('#f6efe2'),co=hx('#ff3b28'),blk=[0,0,0],t=[0,0,0];
  return {outer:phys({color:'#ffffff',metalness:0,roughness:.85,clearcoat:1,sheen:.35,sheenRoughness:.7,sheenColor:'#fff1e6',emissive:'#ffffff',emissiveIntensity:.9},{
   map:pix((u,v,o,i)=>{const k=.82+.18*PR[i];t[0]=wh[0]*k;t[1]=wh[1]*k;t[2]=wh[2]*k;lerp3(t,co,ss(.7,0,Z(u,v).r)*.88,o);}),
   emissive:pix((u,v,o)=>lerp3(blk,co,ss(.55,0,Z(u,v).r)*.7,o)),
   ccRough:pix((u,v,o,i)=>g(o,.2+.55*Math.min(1,D[i]*3))),
   normal:normalMap(H,5), ccNormal:normalMap(D,7)})};
 }}
];

/* ───────── 조명 환경 ───────── */
/* 환경 패널 가장자리를 부드럽게 감쇠 — 각진 패널이 거울면 모서리(구면)에 칼날·물방울 모양으로 맺혀 깨진 것처럼 보이던 문제 */
const softTex=(()=>{const n=128,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),im=x.createImageData(n,n);
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){const ex=Math.min(i,n-1-i)/(n*.5),ey=Math.min(j,n-1-j)/(n*.5);const v=ss(0,.6,ex)*ss(0,.6,ey)*255,k=(j*n+i)*4;im.data[k]=im.data[k+1]=im.data[k+2]=v;im.data[k+3]=255;}
  x.putImageData(im,0,0);return new THREE.CanvasTexture(c);})();
function stripEnv(cfg){
  const s=new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(26,26,26),new THREE.MeshBasicMaterial({color:new THREE.Color(cfg.bg),side:THREE.BackSide})));
  for(const p of cfg.panels){const m=new THREE.Mesh(new THREE.PlaneGeometry(p.w,p.h),new THREE.MeshBasicMaterial({color:new THREE.Color(p.c).multiplyScalar(p.i*1.6),map:softTex}));m.position.set(...p.pos);m.lookAt(0,.5,0);s.add(m);}
  return pmrem.fromScene(s,.02).texture;
}
const ENVS=[
 {label:'쇼룸 고대비',bg:'#000000',back:'#000000',floorC:'#060607',sun:{c:'#ffffff',i:26},key:10.2,
  panels:[{w:6,h:6,pos:[0,9,0],c:'#ffffff',i:2.4},{w:.9,h:8,pos:[5,2.5,3],c:'#e8f0ff',i:7},{w:.7,h:8,pos:[-5,3,-3],c:'#fff6ec',i:5}]},
 {label:'도심 햇살',bg:'#6f8197',back:'#aeb9c5',floorC:'#8d8b86',sun:{c:'#fff1dc',i:45},key:5.1,
  panels:[{w:22,h:22,pos:[0,12,0],c:'#cfe0ff',i:1.5},{w:2.6,h:2.6,pos:[6,8,4],c:'#fff3e0',i:14},{w:10,h:12,pos:[-11,3,0],c:'#9fb0c4',i:.7},{w:12,h:10,pos:[0,3,-11],c:'#c9d0d8',i:.9},{w:22,h:22,pos:[0,-8,0],c:'#8a857c',i:.45}]},
 {label:'오전 사선광',bg:'#2d3440',back:'#39414d',floorC:'#6f6c67',sun:{c:'#ffe2b8',i:35},key:3.4,
  panels:[{w:4.5,h:1.8,pos:[9,1.4,3],c:'#ffe2b8',i:12},{w:20,h:20,pos:[0,12,0],c:'#b8cff0',i:.7},{w:10,h:8,pos:[-11,3,-2],c:'#8ea2bd',i:.4}]},
 {label:'암실 냉백색 스트립',bg:'#020203',back:'#050506',floorC:'#0c0c0d',sun:{c:'#ffffff',i:14},key:10.2,
  panels:[{w:.8,h:9,pos:[4.5,3,2.5],c:'#e2ebff',i:5},{w:4,h:2,pos:[0,9,0],c:'#ffffff',i:.18},{w:3,h:3,pos:[-6,2,-4],c:'#d8e2f5',i:.5}]},
 {label:'스튜디오',room:true,back:'#1b1c1f',floorC:'#2a2b2e',sun:{c:'#ffffff',i:22},key:6.8}
];
let envIdx=0,bgBlack=true;
const envTex=e=>e.tex||(e.tex=e.room?pmrem.fromScene(new RoomEnvironment(renderer),.04).texture:stripEnv(e));

/* ───────── 바닥 / 조명 ───────── */
const fa=document.createElement('canvas');fa.width=fa.height=256;{const x=fa.getContext('2d'),gr=x.createRadialGradient(128,128,0,128,128,128);gr.addColorStop(0,'#fff');gr.addColorStop(.55,'#888');gr.addColorStop(1,'#000');x.fillStyle=gr;x.fillRect(0,0,256,256);}
const floorMat=new THREE.MeshStandardMaterial({color:'#8d8b86',roughness:.92,metalness:0,transparent:true,alphaMap:new THREE.CanvasTexture(fa)});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,16),floorMat);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const key=new THREE.RectAreaLight('#e6eeff',6,.22,3.2);scene.add(key);
const sun=new THREE.SpotLight('#ffffff',30,0,.55,.9,2);sun.position.set(2.2,5.2,2.4);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;sun.shadow.camera.near=2;sun.shadow.camera.far=12;scene.add(sun);scene.add(sun.target);

/* ───────── 시편 ───────── */
let RAD=.04;const geoCache={};
/* RoundedBoxGeometry(r160)의 UV는 평면 중앙에서 퇴화(같은 값으로 붕괴)해 노멀맵이 별/마름모 모양으로 깨짐 →
   면별 평면 투영 UV로 다시 계산 (각 면을 바깥에서 볼 때 u=오른쪽, v=위, 미러링 없음) */
function planarUV(gm,size){
  const p=gm.attributes.position.array,uv=gm.attributes.uv.array,ft=p.length/6;
  for(let i=0,j=0;i<p.length;i+=3,j+=2){
    const x=p[i]/size,y=p[i+1]/size,z=p[i+2]/size;let u,v;
    switch(Math.floor(i/ft)){case 0:u=.5-z;v=.5+y;break;case 1:u=.5+z;v=.5+y;break;case 2:u=.5+x;v=.5-z;break;
      case 3:u=.5+x;v=.5+z;break;case 4:u=.5+x;v=.5+y;break;default:u=.5-x;v=.5+y;}
    uv[j]=u;uv[j+1]=v;}
  gm.attributes.uv.needsUpdate=true;return gm;
}
const geo=(r,inner)=>{const k=(inner?'i':'o')+r.toFixed(3);
  return geoCache[k]||(geoCache[k]=inner?planarUV(new RoundedBoxGeometry(.96,.96,.96,8,Math.max(.003,r-.02)),.96):planarUV(new RoundedBoxGeometry(1,1,1,8,r),1));};
const specimens=[];const tune={amp:1,env:.85,rough:0,glow:1};
function buildSpecimen(def,idx){
  const m=def.make(),gp=new THREE.Group();gp.userData.idx=idx;
  const outer=new THREE.Mesh(geo(RAD),m.outer);outer.castShadow=true;outer.receiveShadow=!def.glass;gp.add(outer);
  let inner=null;if(m.inner){inner=new THREE.Mesh(geo(RAD,true),m.inner);gp.add(inner);}
  gp.position.y=.5;scene.add(gp);
  specimens.push({def,g:gp,outer,inner,mats:[m.outer,m.inner].filter(Boolean)});
}
function applyTune(){
  for(const s of specimens)for(const m of s.mats){
    m.normalScale.set(tune.amp,tune.amp);m.clearcoatNormalScale.set(tune.amp,tune.amp);
    m.envMapIntensity=tune.env*m.userData.envBoost;m.emissiveIntensity=m.userData.glow*tune.glow;m.roughness=THREE.MathUtils.clamp(m.userData.baseRough+tune.rough,.02,1);}
  floorMat.envMapIntensity=tune.env*.6;
}
const applyRadius=()=>specimens.forEach(s=>{s.outer.geometry=geo(RAD);if(s.inner)s.inner.geometry=geo(RAD,true);});

/* ───────── 모드 / 배치 / 시점 ───────── */
let mode='single',sel=0;
const ring=new THREE.Mesh(new THREE.RingGeometry(.62,.66,64),new THREE.MeshBasicMaterial({color:'#e6eeff',transparent:true,opacity:.6}));
ring.rotation.x=-Math.PI/2;ring.position.y=.003;scene.add(ring);
function layout(){
  const portrait=innerHeight>innerWidth;
  specimens.forEach((s,i)=>{
    if(mode==='single'){s.g.visible=i===sel;s.g.scale.setScalar(1);s.g.position.set(0,.5,0);}
    else{s.g.visible=true;const sc=.78,cols=portrait?2:4,rows=8/cols,gap=1.22;s.g.scale.setScalar(sc);
      s.g.position.set((i%cols-(cols-1)/2)*gap,.5*sc,(Math.floor(i/cols)-(rows-1)/2)*gap);}
  });
  ring.visible=mode==='grid';const s=specimens[sel];if(s){ring.position.x=s.g.position.x;ring.position.z=s.g.position.z;}
}
const VIEWS={
  oblique:{label:'사선 45°',s:[2.6,1.75,3.1],t:[0,.5,0]},
  front:{label:'정면',s:[0,.55,3.9],t:[0,.5,0]},
  graze:{label:'그레이징',s:[3.6,.62,.55],t:[0,.5,0]},
  center:{label:'조작부 매크로',s:[.12,.6,1.45],t:[0,.5,0]},
  edge:{label:'엣지 매크로',s:[.78,1.18,.82],t:[0,.5,0]},
  top:{label:'윗면',s:[.01,3.6,.6],t:[0,.5,0]}
};
let view='oblique';
function setView(v){
  view=v;
  if(mode==='grid'){const p=innerHeight>innerWidth;camera.position.set(0,p?9.4:4.6,p?4.6:6.2);controls.target.set(0,.39,0);}
  else{camera.position.set(...VIEWS[v].s);controls.target.set(...VIEWS[v].t);}
  controls.update();
}

/* ───────── UI ───────── */
const $=id=>document.getElementById(id),chipsEl=$('chips');
const lighten=h=>{const c=new THREE.Color(h);c.offsetHSL(0,0,.16);return '#'+c.getHexString();};
DEFS.forEach((d,i)=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',i===0);
  b.innerHTML=`<i style="background:radial-gradient(120% 90% at 30% 20%, ${lighten(d.sw)} 0%, ${d.sw} 60%, #111 100%)"></i><div><span>${String(i+1).padStart(2,'0')} ${d.kr}</span><small>${d.mat}</small></div>`;
  b.onclick=()=>select(i,true);chipsEl.appendChild(b);});
function renderSpec(){
  const d=DEFS[sel],nm=`${String(sel+1).padStart(2,'0')} ${d.kr}`;
  $('pSpec').innerHTML=`<h2>${d.kr}</h2><p class="en">${d.en}</p><p class="mat">${d.type} · ${d.mat}</p>
  <dl><dt>공정</dt><dd>${d.proc}</dd><dt>마감</dt><dd>${d.fin}</dd><dt>효과</dt><dd>${d.eff}</dd><dt>한계</dt><dd>${d.lim}</dd><dt>구현</dt><dd>${d.sim}</dd></dl>
  <p class="note">${d.col}</p>`;
  $('hdrSub').textContent=nm;$('gripName').textContent=nm;
}
function select(i,scroll){sel=i;[...chipsEl.children].forEach((c,k)=>c.setAttribute('aria-pressed',k===i));
  if(scroll)chipsEl.children[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});renderSpec();layout();}
const sheet=$('sheet');let sy=null,swiped=false;
function setCollapsed(c){sheet.classList.toggle('collapsed',c);$('grip').setAttribute('aria-expanded',!c);
  $('gripHint').textContent=c?'탭하거나 위로 밀어 사양·조정 열기':'탭하거나 아래로 밀어 접기';}
$('grip').onclick=()=>{if(!swiped)setCollapsed(!sheet.classList.contains('collapsed'));swiped=false;};
$('handle').addEventListener('pointerdown',e=>{sy=e.clientY;swiped=false;});
$('handle').addEventListener('pointerup',e=>{if(sy===null)return;const dy=e.clientY-sy;sy=null;
  if(dy>28){setCollapsed(true);swiped=true;}else if(dy<-28){setCollapsed(false);swiped=true;}});
$('prev').onclick=()=>select((sel+7)%8,true);$('next').onclick=()=>select((sel+1)%8,true);
canvas.addEventListener('pointerdown',()=>{if(innerHeight>innerWidth)setCollapsed(true);});
setCollapsed(true);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>document.querySelectorAll('.tabs button').forEach(x=>{x.setAttribute('aria-selected',x===b);$(x.dataset.p).hidden=x!==b;}));
function setMode(m){mode=m;$('mSingle').setAttribute('aria-pressed',m==='single');$('mGrid').setAttribute('aria-pressed',m==='grid');layout();setView(view);}
$('mSingle').onclick=()=>setMode('single');$('mGrid').onclick=()=>setMode('grid');
ENVS.forEach((e,i)=>{const b=document.createElement('button');b.className='pill';b.textContent=e.label;b.setAttribute('aria-pressed',i===0);
  b.onclick=()=>{setEnv(i);[...$('envRow').children].forEach((x,k)=>x.setAttribute('aria-pressed',k===i));};$('envRow').appendChild(b);});
Object.entries(VIEWS).forEach(([k,v])=>{const b=document.createElement('button');b.className='pill';b.textContent=v.label;b.setAttribute('aria-pressed',k===view);
  b.onclick=()=>{if(mode==='grid')mode='single';setView(k);setMode(mode);[...$('viewRow').children].forEach(x=>x.setAttribute('aria-pressed',x===b));};$('viewRow').appendChild(b);});
['검정 배경','조명 환경색'].forEach((t,i)=>{const b=document.createElement('button');b.className='pill';b.textContent=t;b.setAttribute('aria-pressed',i===0);
  b.onclick=()=>{bgBlack=i===0;setEnv(envIdx);[...$('bgRow').children].forEach((x,k)=>x.setAttribute('aria-pressed',k===i));};$('bgRow').appendChild(b);});
let sweep=true,angle=40;
$('tSweep').onclick=e=>{sweep=!sweep;e.currentTarget.setAttribute('aria-pressed',sweep);};
$('tRot').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.setAttribute('aria-pressed',controls.autoRotate);};
const bind=(id,fn,fmt=v=>v.toFixed(2))=>{const el=$(id),out=el.nextElementSibling;el.addEventListener('input',()=>{const v=parseFloat(el.value);out.textContent=fmt(v);fn(v);});};
const setSlider=(id,v,fmt=x=>x.toFixed(1))=>{$(id).value=v;$(id).nextElementSibling.textContent=fmt(v);};
bind('sAng',v=>angle=v,v=>Math.round(v)+'°');
bind('sExp',v=>renderer.toneMappingExposure=v);
bind('sGlow',v=>{tune.glow=v;bloom.strength=v;applyTune();});
bind('sSat',v=>grade.uniforms.sat.value=v);
bind('sEnv',v=>{tune.env=v;applyTune();});
bind('sKey',v=>key.intensity=v,v=>v.toFixed(1));
bind('sTexA',v=>{tune.amp=v;applyTune();});
bind('sRad',v=>{RAD=v;applyRadius();},v=>v.toFixed(3));
bind('sRgh',v=>{tune.rough=v;applyTune();});
function setEnv(i){
  envIdx=i;const e=ENVS[i];
  scene.environment=envTex(e);scene.background=new THREE.Color(bgBlack?'#000000':e.back);
  floorMat.color.set(bgBlack?'#060607':e.floorC);sun.color.set(e.sun.c);sun.intensity=e.sun.i;
  key.intensity=e.key;setSlider('sKey',e.key);applyTune();
}
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup',e=>{if(!down||mode!=='grid')return;if(Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);
  const h=ray.intersectObjects(specimens.map(s=>s.outer))[0];if(h)select(h.object.parent.userData.idx,true);});

/* ───────── 루프 ───────── */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);composer.setSize(w,h);camera.aspect=w/h;camera.fov=h>w?42:32;camera.updateProjectionMatrix();}
addEventListener('resize',()=>{resize();layout();if(mode==='grid')setView(view);});
const clock=new THREE.Clock(),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(){
  const dt=clock.getDelta();
  if(sweep&&!reduce){angle=(angle+dt*14)%360;$('sAng').value=angle;$('oAng').textContent=Math.round(angle)+'°';}
  const a=THREE.MathUtils.degToRad(angle);key.position.set(Math.cos(a)*3.2,1.9,Math.sin(a)*3.2);key.lookAt(0,.5,0);
  controls.update();composer.render();requestAnimationFrame(tick);
}
const frame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
(async()=>{
  try{
    for(let i=0;i<DEFS.length;i++){$('load').textContent=`표면 맵을 생성하는 중… ${i+1}/8 ${DEFS[i].kr}`;await frame();buildSpecimen(DEFS[i],i);}
    setEnv(0);applyTune();resize();select(0,false);setView('oblique');
    $('load').classList.add('done');tick();
  }catch(err){$('load').textContent='3D를 시작하지 못했습니다. WebGL2를 지원하는 최신 브라우저에서 다시 열어 주세요. ('+err.message+')';}
})();
</script>
