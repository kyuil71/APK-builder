name: Build RoadGuardian APK

# road-guardian 폴더(네이티브 Kotlin 앱)가 바뀌면 빌드해서 Releases에 RoadGuardian.apk를 올립니다.
on:
  push:
    branches: [ main ]
    paths:
      - 'road-guardian/**'
      - '.github/workflows/road-guardian.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: road-guardian
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: road-guardian
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ── AI 모델: COCO 사전학습 YOLOv8n (ONNX, 640×640) ── 빌드 때만 내려받고 APK 안에 넣습니다
      - name: Cache YOLOv8n model
        uses: actions/cache@v4
        with:
          path: road-guardian/app/src/main/assets/yolov8n.onnx
          key: yolov8n-onnx-640-v1

      - name: Get YOLOv8n model
        run: |
          M=app/src/main/assets/yolov8n.onnx
          mkdir -p app/src/main/assets
          if [ ! -s "$M" ] || [ $(stat -c%s "$M") -lt 5000000 ]; then
            echo "Hugging Face에서 내려받기 시도"
            curl -L --fail --retry 3 -o "$M" "https://huggingface.co/webml/yolov8n/resolve/main/onnx/yolov8n.onnx?download=true" || rm -f "$M"
          fi
          if [ ! -s "$M" ] || [ $(stat -c%s "$M") -lt 5000000 ]; then
            echo "직접 변환 (ultralytics → ONNX)"
            pip install --quiet "ultralytics" "onnx"
            python - <<'PY'
          from ultralytics import YOLO
          import shutil
          p = YOLO("yolov8n.pt").export(format="onnx", imgsz=640, opset=12, simplify=False)
          shutil.copy(p, "app/src/main/assets/yolov8n.onnx")
          PY
          fi
          ls -la "$M"; sha256sum "$M"
          python3 - <<'PY'
          try:
              import onnx
              m = onnx.load("app/src/main/assets/yolov8n.onnx")
              i = m.graph.input[0]; o = m.graph.output[0]
              dims = lambda t: [d.dim_value for d in t.type.tensor_type.shape.dim]
              print("input", i.name, dims(i), "output", o.name, dims(o), "opset", m.opset_import[0].version)
          except Exception as e:
              print("onnx 점검 생략:", e)
          PY

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # 빌드 로그를 ci-logs 브랜치에 남깁니다 (성공·실패 모두)
      - name: Save build log
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          cp "$GITHUB_WORKSPACE/road-guardian/build.log" road-guardian-build.log 2>/dev/null || echo "(build.log 없음 — 빌드 이전 단계에서 실패)" > road-guardian-build.log
          echo "run ${{ github.run_number }} · ${{ job.status }} · $(date -u)" > STATUS.txt
          git add . && git commit -qm "road-guardian build log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs

      - name: Collect APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/RoadGuardian.apk
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: road-guardian
          path: out/RoadGuardian.apk

      - name: Publish release (폰에서 바로 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: road-guardian-${{ github.run_number }}
          name: AI Road Guardian v0.1.${{ github.run_number }} (시험용)
          make_latest: false
          body: |
            **RoadGuardian.apk** — 차량·보행자·차선을 폰 안에서 실시간 인식하고 충돌 위험을 경고하는 연구·시험용 앱
            (갤럭시 Z 폴드8 울트라 기준, 인터넷 권한 없음)

            설치: 아래 RoadGuardian.apk를 눌러 다운로드 → 설치. 처음 한 번은 '출처를 알 수 없는 앱 설치'를 허용하세요.
            이미 설치했다면 덮어 설치하면 업데이트됩니다.

            ⚠️ 실제 도로에서 검증된 충돌 방지 장치가 아닙니다. 먼저 앱의 '영상 시험'으로 녹화 영상에서 시험하세요.
          files: out/RoadGuardian.apk
