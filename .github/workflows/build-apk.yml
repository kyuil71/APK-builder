name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build all apps
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/softsmile/debug/app-softsmile-debug.apk out/SoftSmile.apk
          cp app/build/outputs/apk/cmfcube/debug/app-cmfcube-debug.apk out/CMFCube.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk

      - name: Publish release (폰에서 바로 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HTML 앱 모음 v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            폰에서 원하는 APK를 눌러 다운로드한 뒤 설치하세요.
            - **SoftSmile.apk** — 말랑한 미소 · Interaction Lab
            - **CMFCube.apk** — 도약 CMF 큐브 테스트 (3D)

            처음 설치 시 '출처를 알 수 없는 앱 설치'를 허용해야 합니다. 이미 설치한 앱은 덮어 설치하면 업데이트됩니다.
          files: out/*.apk
