name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/SoftSmile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoftSmile-apk
          path: out/SoftSmile.apk

      - name: Publish release (폰에서 바로 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 말랑한 미소 v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            아래 **SoftSmile.apk**를 폰에서 눌러 다운로드한 뒤 설치하세요.
            처음 설치 시 '출처를 알 수 없는 앱 설치'를 허용해야 합니다.
          files: out/SoftSmile.apk
